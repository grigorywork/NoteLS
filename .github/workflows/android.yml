name: Isolated fresh release GC validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fresh-release-gc-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline51
            run: '44129055942'
            source: d9ab945ff33be6fb4d1bb2217f2a16c025879d9e
            apk: NoteLS-1.10.51-code74-permanent-signature.apk
            sha: c95f8604c8ef77578fd2e3a58398bd2dca1f6574e6d54b74848a8c3c001a53df
            flag: --expect-stale
          - label: fixed53
            run: '44334673971'
            source: 6a88a6ad4081226691fa38606ce9867b0a3b0e0f
            apk: NoteLS-1.10.53-code76-permanent-signature.apk
            sha: 4242d659cfb917bba3e4cad95d3359d03c9ea866ff25018caf526c36d15f7835
            flag: ''
    env:
      SIGNED_RUN_ID: ${{ matrix.run }}
      EXPECTED_SOURCE: ${{ matrix.source }}
      EXPECTED_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: NoteLS-permanent-signature-${{ matrix.source }}
          path: release-apk
      - name: Verify exact immutable signed APK
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,os,subprocess,re,json
          folder=pathlib.Path('release-apk');apk,=folder.glob('*.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();assert digest==os.environ['EXPECTED_SHA']
          assert (folder/'SHA256SUMS').read_text().strip()==digest+'  '+apk.name
          assert 'Источник: '+os.environ['EXPECTED_SOURCE']+'\n' in (folder/'README.txt').read_text()
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools'/'35.0.0'
          pin=pathlib.Path('.github/signing-certificate.sha256').read_text().strip()
          signed=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
          assert re.findall(r'^Signer #\d+ certificate SHA-256 digest: (\w+)$',signed,re.M)==[pin]
          for version in [2,3]: assert re.search(rf'Verified using v{version} scheme .*: true',signed)
          badging=subprocess.check_output([str(tools/'aapt2'),'dump','badging',str(apk)],text=True)
          assert "package: name='com.notessync.app'" in badging and 'application-debuggable' not in badging
          out=pathlib.Path('release-settings-probe');out.mkdir(exist_ok=True)
          (out/'input.json').write_text(json.dumps({'signed_run_id':os.environ['SIGNED_RUN_ID'],'source':os.environ['EXPECTED_SOURCE'],'apk_sha256':digest,'certificate_sha256':pin,'non_debuggable':True},indent=2))
          PY
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -memory 2048 -cores 2
          script: python3 scripts/release_settings_gc_probe.py --apk 'release-apk/${{ matrix.apk }}' ${{ matrix.flag }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gc-fresh-${{ matrix.label }}
          path: release-settings-probe/
          if-no-files-found: warn
