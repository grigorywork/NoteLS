name: Isolated minified settings GC audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-minified-settings-gc-audit
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44129055942
          name: NoteLS-permanent-signature-d9ab945ff33be6fb4d1bb2217f2a16c025879d9e
          path: baseline-apk
      - name: Verify exact previously delivered APK
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          p=next(pathlib.Path('baseline-apk').glob('*.apk'))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='c95f8604c8ef77578fd2e3a58398bd2dca1f6574e6d54b74848a8c3c001a53df'
          PY
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -memory 2048 -cores 2
          script: python3 scripts/release_settings_gc_probe.py --apk baseline-apk/NoteLS-1.10.51-code74-permanent-signature.apk --expect-stale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minified-settings-gc-baseline
          path: release-settings-probe/
          if-no-files-found: warn
