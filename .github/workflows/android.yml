name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and compilation
        run: ./gradlew :app:testDebugUnitTest --tests com.notessync.app.launcher.LauncherIconUiTest --tests com.notessync.app.launcher.LauncherIconSelectionTest --console=plain --max-workers=2 --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/editor-preview/
            app/build/reports/navigation-preview/
            app/build/reports/voice-preview/
            app/build/reports/diary-preview/
            app/build/reports/settings-preview/
            app/build/reports/quotes-preview/
            app/build/reports/glass-preview/
            app/build/reports/table-style-preview/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 14
