name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Keep the exact official Robolectric runtime artifacts between successful runs;
      # Maven fetch/verification and the configured upstream/version remain unchanged.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-notels-robolectric-${{ hashFiles('scripts/robolectric-runtime-pins.json') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and prepare exact Robolectric runtimes
        run: |
          python3 scripts/test_prepare_robolectric_runtime.py
          python3 scripts/prepare_robolectric_runtime.py
      - name: Compile disposable native widget host probe
        run: |
          python3 - <<'PYPROBE'
          import ast, os, pathlib, subprocess, tempfile
          module=ast.parse(pathlib.Path('scripts/calendar_widget_host_probe.py').read_text())
          java=next(ast.literal_eval(node.value) for node in module.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='JAVA' for target in node.targets))
          android=pathlib.Path(os.environ['ANDROID_HOME'])/'platforms/android-35/android.jar'
          assert android.is_file(), 'Native helper must compile against the actual Android35 platform'
          with tempfile.TemporaryDirectory(prefix='calendar-host-compile-') as folder:
              root=pathlib.Path(folder); source=root/'HostActivity.java'; source.write_text(java)
              subprocess.run(['javac','--release','8','-cp',str(android),'-d',str(root/'classes'),str(source)],check=True)
              assert (root/'classes/com/notessync/calendarhostprobe/HostActivity.class').is_file()
          print('Disposable widget host Java compiled; actual Android execution remains a separate release gate')
          PYPROBE
      - name: Tests, lint and compilation
        run: ./gradlew :app:testDebugUnitTest --tests '*CalendarTypography*' --tests '*CalendarMathTest' --tests '*Widget*' --tests '*Weekly*' --tests '*SettingsGroupsUiTest' --tests '*CompactSettingsUiTest' --tests '*UiCatalogTest' --tests '*QuickTransformEditorUiTest' --tests '*EditorTransformTest' --tests '*TransformSessionTest' --tests '*TransformCaptureSaveRaceTest' :app:lintDebug :app:assembleDebug --console=plain --max-workers=2 --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/editor-preview/
            app/build/reports/navigation-preview/
            app/build/reports/voice-preview/
            app/build/reports/diary-preview/
            app/build/reports/settings-preview/
            app/build/reports/quotes-preview/
            app/build/reports/glass-preview/
            app/build/reports/table-style-preview/
            app/build/reports/analytics-preview/
            app/build/reports/duration-preview/
            app/build/reports/running-task-preview/
            app/build/reports/subtask-preview/
            app/build/reports/editor-dates-preview/
            app/build/reports/calendar-typography-preview/
            app/build/reports/robolectric-runtime/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare cloud debug APK (not an installed-app update)
        id: debug_apk
        run: |
          python3 - <<'PYAPK'
          import hashlib, json, os, pathlib, shutil
          meta = json.loads(pathlib.Path('app/build/outputs/apk/debug/output-metadata.json').read_text())['elements'][0]
          name = f"NoteLS-{meta['versionName']}-code{meta['versionCode']}-cloud-debug-NOT-UPDATE"
          folder = pathlib.Path('cloud-debug-apk')
          folder.mkdir(exist_ok=True)
          apk = folder / (name + '.apk')
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk', apk)
          (folder / 'SHA256SUMS').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  ' + apk.name + '\n')
          (folder / 'README.txt').write_text('Проверочная облачная Android Debug-сборка. НЕ обновление приложения с постоянной подписью. Ключ пользователя в CI не передаётся.\nИсточник: ' + os.environ['GITHUB_SHA'] + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_name=' + name + '\n')
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.debug_apk.outputs.artifact_name }}
          path: cloud-debug-apk/
          if-no-files-found: error
          retention-days: 14
