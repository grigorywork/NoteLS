org.gradle.jvmargs=-Xmx1408m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Аудит: в песочнице 3.8 ГБ RAM — Kotlin-демон отдельным процессом убивается OOM,
# компилируем внутри процесса Gradle.
kotlin.compiler.execution.strategy=in-process
